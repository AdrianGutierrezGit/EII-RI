TSUPPLIES_UPDATE = update TSUPPLIES set \
	 deliveryterm = ? ,\
	 price = ? ,\
	 version = version + 1 ,\
	 provider_id = ? ,\
	 sparepart_id = ? \
	 where id = ? 
	 
	 


