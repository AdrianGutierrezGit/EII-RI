# TMECHANICS
TMECHANICS_ADD = insert into TMechanics(id, nif, name, surname, version) values (?, ?, ?, ?, ?)
TMECHANICS_REMOVE = delete from TMechanics where id = ?
TMECHANICS_FINDALL = select * from TMechanics
TMECHANICS_UPDATE = update TMechanics set \
	name = ?, \
	surname = ?, \
	version = version+1 \
where id = ?
TMECHANICS_FINDBYID = select * from TMechanics where id = ?
TMECHANICS_FINDBYNIF = SELECT * FROM TMECHANICS WHERE NIF = ?

# TINVOICES
TINVOICES_GETNEXTINVOICENUMBER = select max(number) from TInvoices
TINVOICES_ADD = insert into TInvoices(id, number, date, vat, amount, state, version) \
	values(?, ?, ?, ?, ?, ?, ?)


# TINTERVENTIONS
TINTERVENTIONS_FINDBYMECHANICID = select * from TInterventions where mechanic_id = ? 

# TWORKORDERS
TWORKORDERS_FINDBYMECHANICID = select * from TWorkorders where mechanic_id = ? 
TWORKORDERS_FINDBYID = select * from TWorkOrders where id = ?
TWORKORDERS_UPDATE = update TWorkOrders set \
	vehicle_id = ?, \
	date = ?, \
	description = ?, \
	amount = ?, \
	state = ?, \
	mechanic_id = ?, \
	invoice_id = ?, \
	version = version+1 \
where id = ?

TWORKORDERS_UPDATESTATEANDLINK = update TWorkOrders set \
	state = ?, \
	invoice_id = ?, \
	version = version+1 \
where id = ?

TWORKORDERS_FIND_NOT_INVOICED_BY_CLIENT_NIF = select * \
from TWorkorders w \
	inner join TVehicles v on w.vehicle_id = v.id \
	inner join TClients c on v.client_id = c.id \
where c.nif like ? \
	and w.state = 'FINISHED'
TWORKORDER_FINDBYSTATE = select * from TWorkOrders w where w.state = ?
# TSPAREPARTS
TSPAREPARTS_ALL = select * from TSPAREPARTS
TSPAREPARTS_ADD = insert into TSPAREPARTS(id, code, description, price , stock, maxStock, minStock, version) \
	values (?, ?, ?, ?, ?, ?, ?, ?)
TSPAREPARTS_FINDBYID = select * from TSPAREPARTS sp where sp.id = ?
TSPAREPARTS_FINDBYCODE = select * from TSPAREPARTS sp where sp.code = ?
TSPAREPARTS_UPDATE= update TSPAREPARTS set \
	description =?, \
	maxStock = ?, \
	minStock = ?, \
	version = version + 1, \
	price = ?, \
	stock = ?\
	where code = ?
	
TSPAREPARTS_REMOVE = delete from TSPAREPARTS where code = ?
#TORDERS
TORDERS_FINDBYCODE = select * from TOrders o where o.code = ?
TORDERS_FINDRECEIVECODE = select * from TOrders o where o.code = ? and o.state = 'PENDING'
TORDERS_FINDBYID = select * from TOrders o where o.PROVIDER_ID = ?
TORDERS_FINDBYNIF = select * from TORDERS o JOIN TPROVIDERS p on o.provider_id = p.id where p.nif = ?
#TPROVIDER
TPROVIDER_FINDBYNIF = select * from TPROVIDERS where nif = ? 
TPROVIDER_FINDBYID = select * from TPROVIDERS p where p.id = ?
TPROVIDER_FINDBYSPAREPARTCODE = select * from TPROVIDERS pr join tsupplies s on pr.id = s.provider_id join  \
TSPAREPARTS sp on sp.id = s.sparepart_id where sp.code = ?
TPROVIDER_ADD = INSERT INTO TPROVIDERS( id, email, name, nif, phone, version) \
VALUES ( ?, ?, ?, ?, ?, ?)
TPROVIDER_EMAILPHONENAME = select * from TPROVIDERS p where p.email = ?  and p.phone = ? and p.name = ? 
TPROVIDER_REMOVE = delete from TPROVIDERS p where p.id = ?
TPROVIDER_FINDBYNAME = select * from TPROVIDERS p where p.name = ?
TPROVIDER_UPDATE = update TPROVIDERS set \
	email = ? , \
	name = ? , \
	phone = ? , \
	version = version+1 \
where nif = ?
TPROVIDER_FINDBYNAMEEMAILPHONEANDDIFNIF = select * from TPROVIDERS p\
	where\
	p.email = ? and\
	p.name = ? and\
	p.phone = ? and\
	p.nif <> ?
	
	
#TORDERLINES
TORDERLINES_FINDBYORDERID = select * from TORDERLINES t where t.order_id = ?
TORDERLINES_FINDSPAREPARTIDBYORDERCODE = SELECT od.sparepart_id FROM TORDERLINES od JOIN TSPAREPARTS sp \
	ON od.sparepart_id = sp.id WHERE sp.code = ?
TORDERLINES_UPDATE = update TORDERLINES set \
	price = ?, \
	quantity = ? \
	where sparepart_id = ? \
	and order_id = ?

	
	
